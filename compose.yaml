# Development MySQL service. Supply both passwords outside version control.
services:
  database:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: proxima_dining
      MYSQL_USER: proxima
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set a local database password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set a separate root password}
    ports:
      - '127.0.0.1:3306:3306'
    volumes:
      - dining_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  dining_data:
